name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "crc/backend/**"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Azure Functions Core Tools
        uses: Azure/setup-azure-functions-core-tools@v1
        with:
          version: 4

      - name: Deploy Azure Function
        working-directory: crc/backend
        run: func azure functionapp publish funccloudresumeauedev01 --python